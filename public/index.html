<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
</head>
<body>
  <div class="lights" aria-hidden="true">
    <div class="lamp amber l1"></div><div class="lamp amber l2"></div><div class="lamp amber l3"></div><div class="lamp amber l4"></div>
  </div>

  <div id="app">
    <header class="top">
      <div class="brand">
        <h1>Portfolio</h1>
        <span id="env" class="badge"></span>
        <nav class="top-nav" aria-label="Pages">
          <a href="/" class="nav-link" aria-current="page">Dashboard</a>
          <a href="/taxes.html" class="nav-link">Taxes</a>
        </nav>
      </div>
      <div class="actions">
        <span id="asof" class="muted"></span>
        <button id="blur" class="btn ghost" type="button" aria-pressed="false" title="Blur financial figures">Blur</button>
        <button id="refresh" class="btn ghost" type="button">Refresh</button>
        <button id="settings" class="btn ghost" type="button">Settings</button>
        <button id="add" class="btn" type="button">Add account</button>
      </div>
    </header>

    <main>
      <div id="alerts"></div>

      <section id="notes-sec" class="notes-sec" aria-labelledby="notes-h" hidden>
        <div class="card-head">
          <h2 id="notes-h" class="sec-title">You should know this</h2>
          <button id="notes-next" class="btn ghost btn-sm" type="button" hidden>More notes ›</button>
        </div>
        <div id="notes" class="notes"></div>
      </section>

      <section class="kpis" aria-label="Summary">
        <button class="panel card k-total rise" type="button" id="p-total" style="--i:0">
          <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span><span class="glow"></span>
          <span class="orn" aria-hidden="true"><svg class="armillary" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1"><circle cx="100" cy="100" r="90"/><circle cx="100" cy="100" r="78" stroke-dasharray="2 4"/><ellipse cx="100" cy="100" rx="90" ry="32" transform="rotate(-23 100 100)"/><ellipse cx="100" cy="100" rx="32" ry="90"/><ellipse cx="100" cy="100" rx="60" ry="90" transform="rotate(30 100 100)"/><line x1="100" y1="2" x2="100" y2="198"/><circle cx="100" cy="100" r="9"/><path d="M100 4v10M100 186v10M4 100h10M186 100h10"/></svg></span>
          <span class="open">Open ›</span>
          <span class="label">Total value</span>
          <span id="k-value" class="fig fig-xl tnum">–</span>
          <span id="k-value-sub" class="sub tnum"></span>
          <dl id="k-side" class="k-side"></dl>
        </button>
        <button class="panel card k-overall rise" type="button" id="p-overall" style="--i:1">
          <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span><span class="glow"></span>
          <span class="open">Open ›</span>
          <span class="label">What you put in, and what you've made</span>
          <span class="ov-row">
            <span class="ov-cell"><span class="ov-k">You paid</span><span id="ov-paid" class="fig tnum">–</span></span>
            <span class="ov-op" aria-hidden="true">→</span>
            <span class="ov-cell"><span class="ov-k">Worth today</span><span id="ov-worth" class="fig tnum">–</span></span>
            <span class="ov-op" aria-hidden="true">=</span>
            <span class="ov-cell ov-total"><span class="ov-k">Total gain or loss</span><span id="ov-gain" class="fig tnum">–</span><span id="ov-pct" class="ov-pct tnum"></span></span>
          </span>
          <span class="ov-bar" id="ov-bar" aria-hidden="true"><span class="ov-paid"></span><span class="ov-delta"></span></span>
          <span id="ov-sub" class="sub tnum"></span>
        </button>
        <button class="panel card rise" type="button" id="p-gain" style="--i:2">
          <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span><span class="glow"></span>
          <span class="open">Open ›</span>
          <span class="label">Unrealized gain or loss</span><span id="k-gain" class="fig tnum">–</span><span id="k-gain-sub" class="sub tnum"></span>
        </button>
        <button class="panel card rise" type="button" id="p-cash" style="--i:3">
          <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span><span class="glow"></span>
          <span class="open">Open ›</span>
          <span class="label">Cash across accounts</span><span id="k-cash" class="fig tnum">–</span><span id="k-cash-sub" class="sub tnum"></span>
        </button>
        <button class="panel card rise" type="button" id="p-margin" style="--i:4">
          <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span><span class="glow"></span>
          <span class="open">Open ›</span>
          <span class="label">Margin balance</span><span id="k-margin" class="fig tnum">–</span><span id="k-margin-sub" class="sub tnum"></span>
        </button>
      </section>

      <section id="accounts" class="accounts" aria-label="Linked accounts"></section>

      <div class="fleuron" aria-hidden="true">✦ ❦ ✦</div>

      <section class="panel ledger-panel rise" style="--i:4" id="ledger-sec" aria-labelledby="ledger-h">
        <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
        <div class="card-head">
          <div>
            <h2 id="ledger-h">Daily ledger</h2>
            <div class="ledger-readout tnum">
              <span id="ledger-val" class="ledger-val">–</span>
              <span id="ledger-chg" class="ledger-chg"></span>
              <span id="ledger-day" class="ledger-day muted"></span>
              <span id="ledger-date" class="ledger-date muted"></span>
            </div>
          </div>
          <div class="ledger-controls">
            <select id="ledger-filter" class="ledger-select" aria-label="Filter daily ledger"></select>
            <div class="seg ledger-range" role="group" aria-label="Chart timeframe">
              <button type="button" data-range="1W" aria-pressed="false">1W</button>
              <button type="button" data-range="1M" aria-pressed="true">1M</button>
              <button type="button" data-range="3M" aria-pressed="false">3M</button>
              <button type="button" data-range="YTD" aria-pressed="false">YTD</button>
              <button type="button" data-range="1Y" aria-pressed="false">1Y</button>
              <button type="button" data-range="ALL" aria-pressed="false">ALL</button>
            </div>
            <div class="seg ledger-scale" id="ledger-scale" role="group" aria-label="Chart scale">
              <button type="button" data-scale="val" aria-pressed="true" title="Dollar value">$</button>
              <button type="button" data-scale="pct" aria-pressed="false" title="Percent change over range">%</button>
            </div>
            <div class="seg ledger-zoom" role="group" aria-label="Y-axis zoom and pan">
              <button type="button" id="y-pan-up" title="Pan Y-axis up" aria-label="Pan Y-axis up">↑</button>
              <button type="button" id="y-pan-down" title="Pan Y-axis down" aria-label="Pan Y-axis down">↓</button>
              <button type="button" id="y-zoom-out" title="Zoom out Y-axis" aria-label="Zoom out Y-axis">−</button>
              <button type="button" id="y-zoom-reset" title="Reset Y-axis zoom" aria-pressed="true">Auto</button>
              <button type="button" id="y-zoom-in" title="Zoom in Y-axis" aria-label="Zoom in Y-axis">+</button>
            </div>
          </div>
        </div>
        <div id="ledger-hl" class="ledger-hl tnum" hidden></div>
        <div id="ledger-chart" class="ledger-chart"></div>
        <div id="ledger-legend" class="ledger-legend tnum" hidden></div>
        <p id="ledger-note" class="muted ledger-note" hidden></p>
      </section>

      <section class="panel acct-explorer rise" style="--i:4" id="acct-sec" aria-labelledby="acct-h" hidden>
        <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
        <div class="card-head">
          <div>
            <h2 id="acct-h">Account details</h2>
            <div id="acct-meta" class="acct-meta"></div>
          </div>
          <div class="acct-nav">
            <button id="acct-prev" class="btn ghost btn-sm" type="button" aria-label="Previous account">‹ Prev</button>
            <span id="acct-idx" class="muted tnum"></span>
            <button id="acct-next" class="btn ghost btn-sm" type="button" aria-label="Next account">Next ›</button>
          </div>
        </div>
        <dl id="acct-stats" class="acct-stats tnum"></dl>
        <div class="table-wrap"><table id="acct-positions"></table></div>
      </section>

      <section class="panel alloc-panel rise" style="--i:4">
        <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
        <span class="banker" aria-hidden="true"></span>
        <h2>Allocation</h2>
        <div class="alloc">
          <div><h3 class="label">By account</h3><div id="alloc-inst"></div></div>
          <div><h3 class="label">By asset type</h3><div id="alloc-type"></div></div>
        </div>
      </section>

      <section class="panel rise" style="--i:5" id="holdings-sec">
        <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
        <div class="card-head">
          <div>
            <h2>Holdings</h2>
            <span id="holdings-sub" class="muted">Grouped by app and account, including cash.</span>
          </div>
          <div class="seg" id="holdings-view" role="group" aria-label="Holdings view">
            <button type="button" data-hview="account" aria-pressed="true">By account</button>
            <button type="button" data-hview="combined" aria-pressed="false">Combined</button>
          </div>
        </div>
        <div class="table-wrap"><table id="holdings"></table></div>
      </section>

      <section class="panel rise" style="--i:6" id="margin-sec" aria-labelledby="margin-h">
        <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
        <div class="card-head">
          <div>
            <h2 id="margin-h">Margin</h2>
            <span class="muted">Track margin spending, repayments, and interest paid so far.</span>
          </div>
          <button id="margin-toggle" class="btn ghost btn-sm" type="button">+ Log margin</button>
        </div>
        <dl id="margin-stats" class="acct-stats tnum"></dl>
        <form id="margin-form" class="margin-form" hidden>
          <label><span>Type</span>
            <select name="kind" required>
              <option value="buy">Bought on margin</option>
              <option value="repay">Paid back margin</option>
              <option value="interest">Margin interest paid</option>
            </select>
          </label>
          <label><span>Account</span>
            <select name="accountKey" id="margin-acct"></select>
          </label>
          <label><span>Date</span>
            <input type="date" name="date" id="margin-date" required>
          </label>
          <label><span>Amount ($)</span>
            <input type="number" name="amount" step="0.01" min="0.01" placeholder="500.00" required>
          </label>
          <label><span>Ticker (optional)</span>
            <input type="text" name="ticker" maxlength="20" placeholder="NVDA">
          </label>
          <label><span>Note (optional)</span>
            <input type="text" name="note" maxlength="200" placeholder="Bought 10 shares">
          </label>
          <div class="margin-form-act">
            <button class="btn btn-sm" type="submit">Save entry</button>
            <span id="margin-msg" class="muted" role="status"></span>
          </div>
        </form>
        <div class="table-wrap"><table id="margin-table"></table></div>
      </section>
    </main>
  </div>

  <div class="back" id="back"></div>
  <aside class="drawer parchment" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" tabindex="-1">
    <button class="close" type="button" id="close" aria-label="Close">×</button>
    <div class="label" id="d-label"></div>
    <h2 id="d-title"></h2>
    <p class="d-sub muted" id="d-sub"></p>
    <div id="d-body"></div>
  </aside>

  <div id="tip" class="tip parchment" role="tooltip" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
