<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sign in · Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); position: relative; z-index: 3; }
    .gate .card { width: min(420px, 100%); padding: 34px 30px 30px; display: grid; gap: 16px; text-align: center; border-radius: 2px; }
    .gate h1 { font: 400 40px/1.05 var(--display, "IM Fell English", serif); margin: 0; }
    .gate p { margin: 0; }
    .gate input { font: 500 18px var(--body, "EB Garamond", serif); letter-spacing: .08em; text-align: center; padding: 10px 12px;
      background: rgba(43, 30, 22, .08); border: 1px solid rgba(43, 30, 22, .35); color: inherit; border-radius: 2px; }
    .gate input:focus-visible { outline: 2px solid #8B6914; outline-offset: 2px; }
    .gate .msg { min-height: 1.4em; font-size: 15px; }
    .gate .msg.err { color: #7A2A1C; }
  </style>
</head>
<body>
  <div class="lights" aria-hidden="true"><div class="lamp amber l1"></div><div class="lamp amber l2"></div></div>
  <main class="gate">
    <form class="card parchment" id="form">
      <span class="seal" aria-hidden="true" style="position:static;margin:0 auto">✶</span>
      <h1 id="title">Portfolio</h1>
      <p id="lede">Sign in with the passkey on this device.</p>
      <label id="code-wrap" hidden>
        <span class="label" style="display:block;margin-bottom:6px">Setup code</span>
        <input id="code" type="password" autocomplete="one-time-code" spellcheck="false">
      </label>
      <button class="btn" id="go" type="submit">Sign in with passkey</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="/vendor/webauthn.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
